<!doctype html>
<!--
  GitHub Pages 对 SPA 的支持方案(https://github.com/rafgraph/spa-github-pages)。

  GitHub Pages 没有服务端路由,刷新 /list、/form 等深层链接时会返回 404。
  这里把 404 页面的真实路径编码进查询字符串后重定向回首页,
  index.html 中的配套脚本会在加载时把路径还原,交给 react-router 处理。
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>action-in-reactjs</title>
    <script type="text/javascript">
      // 项目页部署在 /action-in-reactjs/ 子路径下,首段路径需要保留
      var segmentCount = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + segmentCount)
            .join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
